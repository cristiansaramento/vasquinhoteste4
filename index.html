<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise de Texto</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Fredoka', Arial, sans-serif;
    background: #000;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 800px;
    margin: auto;
    background: #fff;
    padding: 20px;
    border-radius: 10px;
}

textarea {
    width: 100%;
    height: 200px;
    padding: 12px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    margin-top: 10px;
    padding: 12px;
    width: 100%;
    background: #000;
    color: #fff;
    border: none;
    cursor: pointer;
}

.card {
    margin-top: 15px;
    padding: 15px;
    border-radius: 8px;
    background: #f5f5f5;
}

.score {
    font-size: 26px;
}

/* loading */
#loading {
    display: none;
    text-align: center;
    margin-top: 20px;
}

/* fogos */
#fireworks {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="container">

<h1>Análise de texto</h1>

<p>Insira um texto com no mínimo 200 caracteres.</p>

<textarea id="texto" placeholder="Cole seu texto aqui..."></textarea>
<button onclick="analisar()">Analisar</button>

<div id="loading">Analisando texto...</div>
<div id="resultado"></div>

</div>

<script>
function analisar() {
    const texto = document.getElementById("texto").value;

    if (texto.length < 200) {
        alert("O texto deve ter no mínimo 200 caracteres.");
        return;
    }

    document.getElementById("resultado").innerHTML = "";
    document.getElementById("loading").style.display = "block";

    setTimeout(() => processar(texto), 1200);
}

function processar(texto) {
    document.getElementById("loading").style.display = "none";

    let scoreIA = 0;
    let scoreHumano = 0;
    let motivos = [];

    const frases = texto.split(/[.!?]/).filter(f => f.trim());
    const palavras = texto.toLowerCase().match(/\b\w+\b/g) || [];

    const tamanhos = frases.map(f => f.length);
    const media = tamanhos.reduce((a,b)=>a+b,0)/tamanhos.length;
    const variacao = Math.max(...tamanhos) - Math.min(...tamanhos);

    const diversidade = new Set(palavras).size / palavras.length;

    // IA
    if (variacao < media * 0.4) {
        scoreIA += 15;
        motivos.push("Frases com pouca variação");
    }

    if (diversidade < 0.45) {
        scoreIA += 15;
        motivos.push("Vocabulário limitado");
    }

    const conectivos = (texto.match(/além disso|portanto|assim|dessa forma|em conclusão/gi) || []).length;
    if (conectivos > 3) {
        scoreIA += 15;
        motivos.push("Uso repetitivo de conectivos");
    }

    if (/introdução|conclusão/i.test(texto)) {
        scoreIA += 10;
        motivos.push("Estrutura muito padronizada");
    }

    // HUMANO
    if (variacao > media * 0.7) {
        scoreHumano += 20;
    }

    if (diversidade > 0.6) {
        scoreHumano += 20;
    }

    if (/eu|acho|penso|minha opinião/i.test(texto)) {
        scoreHumano += 15;
    }

    if (/[!?]/.test(texto)) {
        scoreHumano += 10;
    }

    if (texto.match(/\.\.\.|kkk|rs/)) {
        scoreHumano += 10;
    }

    if (variacao > 100) {
        scoreHumano += 10;
    }

    let humano = 50 + (scoreHumano - scoreIA);

    if (humano > 100) humano = 100;
    if (humano < 0) humano = 0;

    document.getElementById("resultado").innerHTML =
        '<div class="card">' +
            '<div class="score">' + Math.round(humano) + '% de chance de NÃO ser IA</div>' +
        '</div>' +

        '<div class="card">' +
            '<strong>Análise:</strong>' +
            '<ul>' +
                motivos.map(m => '<li>' + m + '</li>').join('') +
            '</ul>' +
        '</div>';

    if (humano >= 95) {
        iniciarFogos();
    }
}

/* fogos */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
let particles = [];

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

function iniciarFogos() {
    particles = [];
    for (let i = 0; i < 120; i++) {
        particles.push({
            x: canvas.width/2,
            y: canvas.height/2,
            angle: Math.random()*Math.PI*2,
            speed: Math.random()*6,
            life: 100
        });
    }
    animar();
}

function animar() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    particles.forEach(p => {
        p.x += Math.cos(p.angle)*p.speed;
        p.y += Math.sin(p.angle)*p.speed;
        p.life--;

        ctx.fillRect(p.x,p.y,2,2);
    });

    particles = particles.filter(p => p.life > 0);

    if (particles.length > 0) requestAnimationFrame(animar);
}
</script>

</body>
</html>
